[project]
name = "nighthawk-sim"
version = "0.1.0"
description = "IBM Quantum Nighthawk (r1 / r2) を Qiskit Aer 上で再現するノイズ付きシミュレータ"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "qiskit>=2.0",
    "qiskit-ibm-runtime>=0.47",
    "qiskit-aer>=0.17",
    "numpy",
    "networkx",
]

[project.optional-dependencies]
plot = ["matplotlib", "pandas"]
chem = ["ffsim", "pyscf", "qiskit-addon-sqd"]
dev = ["pytest"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nighthawk_sim"]

[tool.pytest.ini_options]
testpaths = ["tests"]
